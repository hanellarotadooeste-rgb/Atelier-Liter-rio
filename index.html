    const APP_THEMES = [
      { id: "terracotta", name: "Atelier Terracota", sidebarBg: "#F4EFEA", mainBg: "#FAF8F5", accent: "#8C4A3E", text: "#2C2A29", mutedText: "#7D7571", border: "#E8DFD8", cardBg: "#FFFFFF" },
      { id: "rosegold", name: "Rose Gold & Latte", sidebarBg: "#F7EBEB", mainBg: "#FAF5F5", accent: "#B86B77", text: "#362226", mutedText: "#876D72", border: "#EAD5D7", cardBg: "#FFFFFF" },
      { id: "sage", name: "Sage & Linen", sidebarBg: "#EFEFEA", mainBg: "#F6F6F2", accent: "#5E7059", text: "#262D24", mutedText: "#707A6D", border: "#DBE0D7", cardBg: "#FFFFFF" },
      { id: "dark_academia", name: "Dark Academia", sidebarBg: "#1C1917", mainBg: "#262320", accent: "#C68B59", text: "#EFEBE7", mutedText: "#A8A099", border: "#3D3834", cardBg: "#2C2825" },
      { id: "matcha", name: "Matcha & Vanilla", sidebarBg: "#F2F5ED", mainBg: "#FAFBF7", accent: "#738A58", text: "#242B1C", mutedText: "#76826B", border: "#DCE4D2", cardBg: "#FFFFFF" },
      { id: "lavender", name: "Lavender Dream", sidebarBg: "#F1EFF7", mainBg: "#F8F7FC", accent: "#7B68EE", text: "#27233D", mutedText: "#787394", border: "#DFDAF0", cardBg: "#FFFFFF" }

    const INITIAL_BOOKS = [
      { id: "1", title: "A Paciente Silenciosa", author: "Alex Michaelides", genre: "Thriller", pages: 350, rating: 5, status: "Lido", monthRead: "2026-11", cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600", review: "Um suspense psicológico impactante com um plot twist inesquecível no final. A narrativa te prende do início ao fim." },
      { id: "2", title: "Os Sete Maridos de Evelyn Hugo", author: "Taylor Jenkins Reid", genre: "Ficção Contemporânea", pages: 360, rating: 5, status: "Lido", monthRead: "2026-11", cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=600", review: "Uma história emocionante sobre ambição, amor verdadeiro e os custos da fama na Era de Ouro de Hollywood." },
      { id: "3", title: "Tudo O Que Sei Sobre O Amor", author: "Dolly Alderton", genre: "Memórias / Biografia", pages: 320, rating: 4, status: "Lido", monthRead: "2026-11", cover: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&q=80&w=600", review: "Uma ode às amizades femininas e às confusões dos 20 e poucos anos. Divertido e profundamente confortador." },
      { id: "4", title: "Corte de Espinhos e Rosas", author: "Sarah J. Maas", genre: "Fantasia", pages: 432, rating: 5, status: "Lido", monthRead: "2026-11", cover: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&q=80&w=600", review: "Universo envolvente com personagens inesquecíveis e um romance eletrizante." }
    ];

    const INITIAL_CLOSURES = {
      "2026-11": {
        top1Id: "2",
        favoritesIds: ["1", "2", "4"],
        readingGoal: 4,
        personalNotes: "Um mês com ótimas leituras e finais de semana ensolarados no café!",
        photos: [
          "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&q=80&w=600",
          "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=600",
          "https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&q=80&w=600"
        ]
      }
    };

    const DUMP_STYLES = [
      { id: "scrapbook_aesthetic", name: "Aesthetic Pinterest Dump", bg: "#EAE5D9", cardBg: "#FFFDF9", text: "#1E1B18", accent: "#D9534F", font: "font-sans" },
      { id: "pinterest", name: "Pinterest Editorial", bg: "#F9F6F0", cardBg: "#FFFFFF", text: "#2C2A29", accent: "#8C4A3E", font: "font-serif" },
      { id: "clean", name: "Clean Minimalista", bg: "#FFFFFF", cardBg: "#FAFAFA", text: "#18181B", accent: "#52525B", font: "font-sans" },
      { id: "scrapbook", name: "Scrapbook Cutout", bg: "#F4EFEA", cardBg: "#FFFDF9", text: "#3D352E", accent: "#A0522D", font: "font-mono" },
      { id: "dark_academia", name: "Dark Academia", bg: "#1A1817", cardBg: "#2A2624", text: "#E8E2D9", accent: "#D4A373", font: "font-serif" },
      { id: "lifestyle", name: "Instagram Lifestyle", bg: "#F5F5F7", cardBg: "#FFFFFF", text: "#1D1D1F", accent: "#E07A5F", font: "font-sans" },
      { id: "journal", name: "Literary Journal", bg: "#FAF4E8", cardBg: "#FFFFFF", text: "#2B2D42", accent: "#6B705C", font: "font-serif" }
    ];

    /* Utilitário para comprimir fotos escolhidas direto da galeria do iPad */
    const compressImageFile = (file, maxWidth = 800) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, maxWidth / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function App() {
      const [activeTab, setActiveTab] = useState("home");
      const [selectedMonth, setSelectedMonth] = useState("2026-11");
      const [themeId, setThemeId] = useState(() => localStorage.getItem("literary_app_theme") || "terracotta");
      const [books, setBooks] = useState(() => {
        try { const s = localStorage.getItem("literary_journal_books"); return s ? JSON.parse(s) : INITIAL_BOOKS; } catch { return INITIAL_BOOKS; }
      });
      const [closures, setClosures] = useState(() => {
        try { const s = localStorage.getItem("literary_journal_closures"); return s ? JSON.parse(s) : INITIAL_CLOSURES; } catch { return INITIAL_CLOSURES; }
      });

      /* Estados do Photo Dump */
      const [dumpTheme, setDumpTheme] = useState("scrapbook_aesthetic");
      const [ratio, setRatio] = useState("4:5");
      const [pageIndex, setPageIndex] = useState(0);
      const [customTitle, setCustomTitle] = useState("minhas obsessões recentes");
      const [bgColor, setBgColor] = useState("");
      const [textColor, setTextColor] = useState("");
      const [showStickerBorder, setShowStickerBorder] = useState(true);
      const [stickerBorderWidth, setStickerBorderWidth] = useState(6);
      const [showImessagePopup, setShowImessagePopup] = useState(true);
      const [imessageText, setImessageText] = useState("tudo que não tem saído da minha mente ☕✨📚");
      const [showStarsOverlay, setShowStarsOverlay] = useState(true);
      const [labelStyleText, setLabelStyleText] = useState(true);
      const [stickerRotation, setStickerRotation] = useState(true);

      const [modalOpen, setModalOpen] = useState(false);
      const [editingBook, setEditingBook] = useState(null);

      useEffect(() => { localStorage.setItem("literary_app_theme", themeId); }, [themeId]);
      useEffect(() => { localStorage.setItem("literary_journal_books", JSON.stringify(books)); }, [books]);
      useEffect(() => { localStorage.setItem("literary_journal_closures", JSON.stringify(closures)); }, [closures]);

      const appScheme = APP_THEMES.find(t => t.id === themeId) || APP_THEMES[0];
      const monthBooks = books.filter(b => b.monthRead === selectedMonth && b.status === "Lido");
      const currentClosure = closures[selectedMonth] || { top1Id: null, favoritesIds: [], readingGoal: 4, personalNotes: "", photos: [] };
      const totalPages = monthBooks.reduce((acc, b) => acc + (Number(b.pages) || 0), 0);
      const top1Book = books.find(b => b.id === currentClosure.top1Id) || monthBooks[0];

      const handleSaveBook = (bookData) => {
        if (editingBook) {
          setBooks(books.map(b => b.id === editingBook.id ? { ...bookData, id: editingBook.id } : b));
        } else {
          setBooks([...books, { ...bookData, id: Date.now().toString() }]);
        }
        setModalOpen(false);
        setEditingBook(null);
      };

      const handleDeleteBook = (id) => {
        if (window.confirm("Tem certeza que deseja excluir este livro da biblioteca?")) {
          setBooks(books.filter(b => b.id !== id));
        }
      };

      const getMonthName = (ym) => {
        if (!ym) return "";
        const [y, m] = ym.split("-");
        return new Date(Number(y), Number(m) - 1).toLocaleString("pt-BR", { month: "long", year: "numeric" });
      };

      const navItems = [
        { id: "home", label: "Meu Mês Literário", Icon: IconCalendar },
        { id: "library", label: "Biblioteca Pessoal", Icon: IconBookMarked },
        { id: "closure", label: "Fechamento Mensal", Icon: IconHeart },
        { id: "photodump", label: "Gerador Photo Dump", Icon: IconSparkles },
        { id: "stats", label: "Estatísticas & Meta", Icon: IconBarChart }
      ];

      return (
        <div className="min-h-screen font-sans antialiased flex flex-col md:flex-row transition-colors duration-300" style={{ backgroundColor: appScheme.mainBg, color: appScheme.text }}>
          {/* Sidebar estilo Bloom & Plan para iPad */}
          <aside className="w-full md:w-64 border-b md:border-b-0 md:border-r p-5 md:p-6 flex flex-col justify-between shrink-0 transition-colors duration-300" style={{ backgroundColor: appScheme.sidebarBg, borderColor: appScheme.border }}>
            <div>
              <div className="flex items-center space-x-3 mb-6 md:mb-8">
                <div className="w-10 h-10 rounded-full flex items-center justify-center shadow-md text-white transition-colors duration-300" style={{ backgroundColor: appScheme.accent }}>
                  <IconBookOpen className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-serif text-xl font-bold tracking-tight">Atelier Literário</h1>
                  <p className="text-[10px] font-bold uppercase tracking-widest" style={{ color: appScheme.accent }}>iPad Edition • Photo Dump</p>
                </div>
              </div>

              <nav className="flex md:flex-col gap-1.5 overflow-x-auto pb-2 md:pb-0">
                {navItems.map(({ id, label, Icon }) => {
                  const isActive = activeTab === id;
                  return (
                    <button
                      key={id}
                      onClick={() => setActiveTab(id)}
                      className={`flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-sm font-medium whitespace-nowrap ${isActive ? "shadow-sm font-semibold text-white" : ""}`}
                      style={{ backgroundColor: isActive ? appScheme.accent : "transparent", color: isActive ? "#FFFFFF" : appScheme.mutedText }}

                      <Icon className="w-4 h-4 shrink-0" style={{ color: isActive ? "#FFFFFF" : appScheme.accent }} />
                      <span>{label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="mt-6 md:mt-8 space-y-5 pt-5 border-t" style={{ borderColor: appScheme.border }}>

                </label>
                <div className="grid grid-cols-6 md:grid-cols-3 gap-2">

                      onClick={() => setThemeId(t.id)}

                selectedMonth={selectedMonth}

    function PhotoDumpView({
      appScheme, selectedMonth, monthBooks, closure, top1Book,
      theme, setTheme, ratio, setRatio, pageIndex, setPageIndex,
      customTitle, setCustomTitle, bgColor, setBgColor, textColor, setTextColor,
      showStickerBorder, setShowStickerBorder, stickerBorderWidth, setStickerBorderWidth,
      showImessagePopup, setShowImessagePopup, imessageText, setImessageText,
      showStarsOverlay, setShowStarsOverlay, labelStyleText, setLabelStyleText,
      stickerRotation, setStickerRotation, getMonthName
    }) {
      const styleObj = DUMP_STYLES.find(s => s.id === theme) || DUMP_STYLES[0];
      const finalBg = bgColor || styleObj.bg;
      const finalText = textColor || styleObj.text;
      const [exporting, setExporting] = useState(false);

      /* Renderizador Canvas Nativo High-Res (funciona perfeitamente no Safari iPadOS sem CORS bloqueando imagens) */
      const handleExportCanvas = async () => {
        setExporting(true);
        try {
          const width = 1080;
          const height = ratio === "9:16" ? 1920 : ratio === "1:1" ? 1080 : 1350;
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");

          // Fundo
          ctx.fillStyle = finalBg;
          ctx.fillRect(0, 0, width, height);

          // Helper para desenhar imagem com borda adesivo e rotação
          const loadImg = (url) => new Promise((res) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => res(img);
            img.onerror = () => res(null);
            img.src = url;
          });

          const drawCard = (img, x, y, w, h, deg = 0) => {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            if (stickerRotation && deg !== 0) ctx.rotate((deg * Math.PI) / 180);

            // Sombra
            ctx.shadowColor = "rgba(0,0,0,0.22)";
            ctx.shadowBlur = 32;
            ctx.shadowOffsetY = 12;

            const pad = showStickerBorder ? stickerBorderWidth * 2.5 : 0;
            const radius = 28;
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.roundRect(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad * 2, radius);
            ctx.fill();

            ctx.shadowColor = "transparent";
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, radius - 6);
            ctx.clip();

            if (img) {
              const scale = Math.max(w / img.width, h / img.height);
              const nw = img.width * scale;
              const nh = img.height * scale;
              ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            } else {
              ctx.fillStyle = "#DDD6CE";
              ctx.fillRect(-w / 2, -h / 2, w, h);
            }
            ctx.restore();
          };

          // Cabeçalho
          ctx.fillStyle = styleObj.accent;
          ctx.font = "bold 24px Inter, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`${getMonthName(selectedMonth).toUpperCase()} • READS DUMP`, width / 2, 95);

          const titleText = customTitle || "minhas obsessões recentes";
          if (labelStyleText) {
            ctx.save();
            ctx.translate(width / 2, 165);
            ctx.rotate((-2 * Math.PI) / 180);
            ctx.font = "bold 48px Inter, sans-serif";
            const tw = ctx.measureText(titleText).width + 70;
            ctx.shadowColor = "rgba(0,0,0,0.15)";
            ctx.shadowBlur = 18;
            ctx.fillStyle = "#FEE440";
            ctx.beginPath();
            ctx.roundRect(-tw / 2, -42, tw, 84, 20);
            ctx.fill();
            ctx.shadowColor = "transparent";
            ctx.fillStyle = "#000000";
            ctx.fillText(titleText, 0, 16);
            ctx.restore();
          } else {
            ctx.fillStyle = finalText;
            ctx.font = "bold 56px Georgia, serif";
            ctx.fillText(titleText, width / 2, 180);
          }

          const defaultPhotos = [
            "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&q=80&w=600",
            "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=600"
          ];
          const userPhotos = closure.photos && closure.photos.length > 0 ? closure.photos : defaultPhotos;

          if (pageIndex === 0) {
            const p1 = await loadImg(userPhotos[0]);
            const p2 = await loadImg(userPhotos[1] || userPhotos[0]);
            const centerY = height * 0.43;
            drawCard(p1, 95, centerY - 210, 420, 420, -4);
            drawCard(p2, width - 515, centerY - 190, 420, 420, 3);

            if (monthBooks[0]) {
              const b1 = await loadImg(monthBooks[0].cover);
              drawCard(b1, 130, centerY + 130, 230, 345, 6);
            }
            if (monthBooks[1]) {
              const b2 = await loadImg(monthBooks[1].cover);
              drawCard(b2, width - 360, centerY + 130, 230, 345, -6);
            }
          } else if (pageIndex === 1 && top1Book) {
            const bTop = await loadImg(top1Book.cover);
            drawCard(bTop, width / 2 - 190, height * 0.25, 380, 570, 0);
            ctx.fillStyle = finalText;
            ctx.font = "bold 44px Georgia, serif";
            ctx.fillText(top1Book.title, width / 2, height * 0.25 + 640);
            ctx.font = "30px Inter, sans-serif";
            ctx.fillText(`${top1Book.author} • ★ ${top1Book.rating}/5`, width / 2, height * 0.25 + 695);
          } else {
            const p1 = await loadImg(userPhotos[0]);
            const p2 = await loadImg(userPhotos[1] || userPhotos[0]);
            drawCard(p1, 110, height * 0.30, 400, 400, -3);
            drawCard(p2, width - 510, height * 0.32, 400, 400, 3);
          }

          // Popup estilo iMessage
          if (showImessagePopup) {
            const boxW = 860;
            const boxH = 110;
            const bx = (width - boxW) / 2;
            const by = height - 220;
            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.16)";
            ctx.shadowBlur = 24;
            ctx.fillStyle = "rgba(255,255,255,0.96)";
            ctx.beginPath();
            ctx.roundRect(bx, by, boxW, boxH, 45);
            ctx.fill();
            ctx.shadowColor = "transparent";

            ctx.fillStyle = "#3B82F6";
            ctx.beginPath();
            ctx.arc(bx + 55, by + 55, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 32px Inter, sans-serif";
            ctx.fillText("+", bx + 55, by + 66);

            ctx.fillStyle = "#1F2937";
            ctx.font = "500 28px Inter, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(imessageText.slice(0, 46), bx + 105, by + 65);
            ctx.restore();

            ctx.font = "bold 54px sans-serif";
            ctx.fillText("✦", 120, 250);

          link.href = dataUrl;

              <div className="flex gap-1">
                {[1, 2, 3, 4, 5].map((n) => (
                  <button key={n} type="button" onClick={() => setForm({ ...form, rating: n })} className="p-1" style={{ opacity: n <= form.rating ? 1 : 0.3 }}>
                    <IconStar className="w-6 h-6" style={{ color: appScheme.accent, fill: appScheme.accent }} />
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-xs font-semibold mb-1" style={{ color: appScheme.mutedText }}>Resenha</label>
              <textarea rows={4} value={form.review} onChange={(e) => setForm({ ...form, review: e.target.value })} placeholder="O que você achou do livro?" className="w-full border rounded-xl p-3 text-sm" style={{ backgroundColor: appScheme.mainBg, borderColor: appScheme.border }} />
            </div>

            <div className="flex gap-3 pt-1">
              <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl text-sm font-semibold border" style={{ borderColor: appScheme.border, color: appScheme.mutedText }}>Cancelar</button>
              <button type="submit" className="flex-1 py-3 rounded-xl text-sm font-semibold text-white" style={{ backgroundColor: appScheme.accent }}>Salvar</button>
            </div>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
